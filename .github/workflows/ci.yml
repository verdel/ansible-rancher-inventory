name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run lint and format checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Prepare collection tree for ansible-test
        run: |
          SANITY_ROOT=$(mktemp -d)
          export SANITY_ROOT
          echo "SANITY_ROOT=$SANITY_ROOT" >> "$GITHUB_ENV"
          bash ./.github/scripts/prepare-collection-tree.sh

      - name: Run ansible-test sanity
        working-directory: ${{ env.SANITY_ROOT }}/ansible_collections/verdel/rancher
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ env.SANITY_ROOT }}
        run: ansible-test sanity --local --color no
