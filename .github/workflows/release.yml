name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          {
            echo "name=${tag}"
            echo "ver=${ver}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate collection version
        run: |
          expected="${{ steps.tag.outputs.ver }}"
          actual="$(awk '/^version: / { print $2; exit }' galaxy.yml)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::galaxy.yml version (${actual}) does not match tag v${expected}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run lint and format checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Prepare collection tree for ansible-test
        run: |
          SANITY_ROOT=$(mktemp -d)
          export SANITY_ROOT
          echo "SANITY_ROOT=$SANITY_ROOT" >> "$GITHUB_ENV"
          bash ./.github/scripts/prepare-collection-tree.sh

      - name: Run ansible-test sanity
        working-directory: ${{ env.SANITY_ROOT }}/ansible_collections/verdel/rancher
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ env.SANITY_ROOT }}
        run: ansible-test sanity --local --color no

      - name: Build collection
        run: ansible-galaxy collection build --output-path dist --force

      - name: Publish to Ansible Galaxy
        working-directory: ${{ github.workspace }}
        run: ansible-galaxy collection publish dist/*.tar.gz --token "${{ secrets.GALAXY_API_TOKEN }}"

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          bash ./.github/scripts/extract-changelog.sh "${{ steps.tag.outputs.ver }}" > release-notes.md
          echo "body_file=${GITHUB_WORKSPACE}/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          body_path: ${{ steps.notes.outputs.body_file }}
          generate_release_notes: false
