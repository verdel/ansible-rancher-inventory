# Safe defaults: weekly checks, limited open PRs, grouped GitHub Actions bumps.
# Security updates are separate: not delayed by schedule, groups, or cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - python
    allow:
      - dependency-type: direct
    commit-message:
      prefix: chore
      include: scope
